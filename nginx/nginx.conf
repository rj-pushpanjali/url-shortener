# nginx/nginx.conf
#
# Load balancer: the SINGLE entry point for the API and the short links.
#
#   browser/curl --> nginx :80 (host :5000) --> backend1:5000
#                                           --> backend2:5000   (round robin)
#                                           --> backend3:5000
#
# WHAT NGINX DOES HERE
#   - spreads incoming requests across the three identical backends
#     (round robin: 1, 2, 3, 1, 2, 3, ...). This works only because the app
#     is stateless: any instance can answer any request.
#   - stops sending traffic to an instance that is down, and retries the
#     request on another one, so losing a backend isn't visible to users
#   - tells each backend who the real client is (X-Forwarded-For), which the
#     per-IP rate limits depend on
#
# Mounted read-only at /etc/nginx/nginx.conf by docker-compose.yml.
# Check the syntax with the stack running:  docker compose exec nginx nginx -t

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off; # don't advertise the nginx version

    # Access log to stdout (visible with `docker compose logs nginx`), showing
    # WHICH backend served each request: upstream=<ip:port> differs per request.
    log_format upstream_log '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                            'upstream=$upstream_addr upstream_status=$upstream_status '
                            'request_time=$request_time request_id=$request_id';
    access_log /dev/stdout upstream_log;

    # The pool of backends. These are Docker service names (DNS names on the
    # compose network) and the port the app listens on INSIDE its container.
    # No balancing method is named, so nginx uses its default: round robin.
    #
    # NOTE: nginx resolves these names ONCE, when it starts. If a backend
    # container is re-created and gets a new IP, run:  docker compose restart nginx
    upstream backend_servers {
        # max_fails/fail_timeout = passive health checking. After 2 failed
        # attempts within 10s, nginx treats that backend as down for 10s and
        # skips it, then tries it again.
        server backend1:5000 max_fails=2 fail_timeout=10s;
        server backend2:5000 max_fails=2 fail_timeout=10s;
        server backend3:5000 max_fails=2 fail_timeout=10s;

        # Reuse connections to the backends instead of opening a new TCP
        # connection per request. Requires HTTP/1.1 and an empty Connection
        # header (set below).
        keepalive 16;
        # Close idle upstream connections after 4s: SHORTER than Node's own
        # idle timeout (5s). Otherwise nginx can reuse a connection at the very
        # moment Node closes it, producing the occasional 502.
        keepalive_timeout 4s;
    }

    server {
        listen 80;

        # The API only exchanges tiny JSON bodies (Express allows 100kb).
        client_max_body_size 100k;

        # Answered by nginx itself, never proxied. Used by the container
        # healthcheck, so "nginx is alive" doesn't depend on the backends.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Prometheus metrics are for the internal network only (Prometheus
        # scrapes the backends directly). Never expose them to the internet.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://backend_servers;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Pass the real client through. The backends sit behind exactly
            # ONE proxy (this one) and run with TRUST_PROXY=1, so Express reads
            # the client IP from the LAST entry of X-Forwarded-For: the one
            # nginx appends ($remote_addr). Anything a client puts in its own
            # X-Forwarded-For stays to the left and is ignored, so the per-IP
            # rate limits can't be dodged by faking the header.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # One id per request, set here at the edge. The backend puts it in
            # its logs and in the X-Request-Id response header, and nginx logs
            # it too (request_id=...), so one string finds a request everywhere.
            proxy_set_header X-Request-Id $request_id;

            # The 302 redirects point at OTHER sites (the long URLs). Never
            # rewrite Location headers.
            proxy_redirect off;

            # Fail over quickly. A stopped container's address doesn't answer
            # at all, so without a short connect timeout a request would wait a
            # full minute before nginx tried the next backend.
            proxy_connect_timeout 2s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # If a backend errors, times out or answers 502/503, retry the
            # request on the next backend (at most 3 tries, within 10s).
            # nginx will NOT replay a POST that a backend already received,
            # so a create-URL request is never executed twice by a retry. A
            # failure to even connect is retried for any method.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
