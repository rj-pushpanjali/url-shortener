# .github/workflows/ci.yml
#
# On every push and pull request:
#   1. backend-tests   unit tests (node --test)  + the load-test script's self-test
#   2. frontend-build  `vite build` must succeed
#   3. docker-smoke    build every image, start the WHOLE stack (nginx, 3 backends,
#                      worker, Postgres, Redis, frontend) and run scaling-tests/run.js
#                      against it (everything except the failover test)
#
# Dependencies install with `npm ci` when a package-lock.json is committed
# (recommended: run `npm install` once in backend/ and frontend/ and commit
# the lockfiles) and fall back to `npm install` otherwise.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Unit tests
        run: npm test
      - name: Load-test script self-test
        working-directory: .
        run: node --test "loadtest/test/*.test.js"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create .env with throwaway secrets
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait until the stack answers
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health >/dev/null && curl -fsS http://localhost:5173/healthz >/dev/null; then
              echo "stack is up"; exit 0
            fi
            sleep 3
          done
          echo "stack did not become healthy in time"; docker compose ps; exit 1
      - name: Frontend serves the app and its SPA fallback
        run: |
          curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
          curl -fsS http://localhost:5173/login | grep -q '<div id="root">'
      - name: Scaling tests (all but failover)
        run: node scaling-tests/run.js --skip-failover
      - name: Metrics are exposed on the backends but not through nginx
        run: |
          docker compose exec -T backend1 node -e "fetch('http://127.0.0.1:5000/metrics').then(async r => { const t = await r.text(); if (!r.ok || !t.includes('http_requests_total')) process.exit(1); })"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/metrics)" = "404"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
