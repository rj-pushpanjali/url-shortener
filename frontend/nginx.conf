# frontend/nginx.conf  (installed as /etc/nginx/conf.d/default.conf)
#
# Serves the built React app (static files) in production.
#
#   /assets/*         hashed filenames -> cached for a year, immutable
#   /index.html, SPA  never cached, so a new deploy is picked up immediately
#   /api/*, /auth/*   proxied to the load balancer (this is what lets the
#                     browser talk to ONE origin; no CORS needed). With the
#                     production Caddy setup (docker-compose.prod.yml) Caddy
#                     routes these paths straight to the load balancer, so
#                     this proxy is only used for local `docker compose up`.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 100k;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;

    # Answered by nginx itself; used by the container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Docker's embedded DNS. Using a variable in proxy_pass makes nginx look
    # the name up per request (valid=10s) instead of once at startup, so a
    # re-created load balancer container never leaves a stale address here.
    location ~ ^/(api|auth)/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://nginx;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Single-page app: any other path is a client-side route
    # (/login, /register, ...), so serve index.html and let React Router decide.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
