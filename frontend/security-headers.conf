# frontend/security-headers.conf  (installed as /etc/nginx/security-headers.conf)
#
# Included in every location that sets its own add_header (nginx does not
# inherit add_header from the server block into a location that defines one).
#
# The CSP matches this app exactly: scripts and styles only from our own
# origin (Vite emits external files, no inline scripts), API calls to our own
# origin, nothing may frame the app.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
